name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_CHECKIN_CODE: ${{ secrets.VITE_CHECKIN_CODE }}
          VITE_EVENT_TITLE: ${{ secrets.VITE_EVENT_TITLE }}
          VITE_EVENT_AGE: ${{ secrets.VITE_EVENT_AGE }}
          VITE_EVENT_DATE: ${{ secrets.VITE_EVENT_DATE }}
          VITE_EVENT_TIME: ${{ secrets.VITE_EVENT_TIME }}
          VITE_EVENT_CITY: ${{ secrets.VITE_EVENT_CITY }}
          VITE_EVENT_VENUE: ${{ secrets.VITE_EVENT_VENUE }}
          VITE_EVENT_ADDRESS: ${{ secrets.VITE_EVENT_ADDRESS }}
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_CHECKIN_CODE: ${{ secrets.VITE_CHECKIN_CODE }}
          VITE_EVENT_TITLE: ${{ secrets.VITE_EVENT_TITLE }}
          VITE_EVENT_AGE: ${{ secrets.VITE_EVENT_AGE }}
          VITE_EVENT_DATE: ${{ secrets.VITE_EVENT_DATE }}
          VITE_EVENT_TIME: ${{ secrets.VITE_EVENT_TIME }}
          VITE_EVENT_CITY: ${{ secrets.VITE_EVENT_CITY }}
          VITE_EVENT_VENUE: ${{ secrets.VITE_EVENT_VENUE }}
          VITE_EVENT_ADDRESS: ${{ secrets.VITE_EVENT_ADDRESS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
